# docker-compose.yml — Entorno de desarrollo para Aprende-Gratis
# Levanta los 3 servicios mínimos: base de datos Postgres (18.6), backend (FastAPI) y frontend (React 19).

services:
  postgres:
    image: postgres:18.6
    container_name: aprende-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aprende}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aprende}
      POSTGRES_DB: ${POSTGRES_DB:-aprende_gratis}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  backend:
    build: ./backend
    container_name: aprende-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://aprende:aprende@postgres:5432/aprende_gratis}
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    container_name: aprende-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  postgres_data:
