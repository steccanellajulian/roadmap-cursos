# docker-compose.yml — Entorno de producción / desarrollo con healthchecks y dependencias ordenadas
# Cumple con la especificación de Ticket T10:
# - postgres con pg_isready
# - backend y frontend con healthchecks propios
# - depends_on condicionado a service_healthy (3/3 servicios orquestados)
# - volumen nombrado para persistencia de datos (postgres_data)

services:
  postgres:
    image: postgres:18.6
    container_name: aprende-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aprende}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aprende}
      POSTGRES_DB: ${POSTGRES_DB:-aprende_gratis}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-aprende} -d $${POSTGRES_DB:-aprende_gratis}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aprende-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://aprende:aprende@postgres:5432/aprende_gratis}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aprende-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
